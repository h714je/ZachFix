[Display]
Width = 0
Height = 0
Borderless = true

[Rendering]
# Explicit InternalWidth/InternalHeight take priority when both are non-zero.
# Otherwise InternalScale multiplies the final display resolution.
# 1.0 = native, 1.5 = 150%, 2.0 = 200% (supersampling).
InternalWidth = 0
InternalHeight = 0
InternalScale = 1.0
FixPixelOffset = true

[Shadows]
Scale = 4

[Reflections]
Scale = 4

[DepthOfField]
ImproveResolution = true

[World]
# 1 = vanilla high-detail 2x2 core
# 2 = EXPERIMENTAL exp2: full-detail content across existing 4x4 ring (bulk + incremental paths)
HighDetailDistanceScale = 1

[Profiler]
Enabled = false
CaptureKey = F11
DumpShaders = false
GPUTimings = false
CallerTracing = true
SceneObjectTracing = true
ContinuousTrace = true
ContinuousMaxFrames = 600
MaxEvents = 20000

[UI]
Enabled = true
ToggleKey = F10
