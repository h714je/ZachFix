; ZachFix v0.1.0-rc2
; Deadly Premonition: The Director's Cut rendering/compatibility fix
; F10 opens the in-game settings UI.

[Display]
Width = 0
Height = 0
Borderless = true

[Rendering]
# Explicit InternalWidth/InternalHeight take priority when both are non-zero.
# Otherwise InternalScale multiplies the final display resolution.
# 1.0 = native, 1.5 = 150%, 2.0 = 200% (supersampling).
InternalWidth = 0
InternalHeight = 0
InternalScale = 1.0
FixPixelOffset = true

[Shadows]
Scale = 4

# Original DPFix shadow-depth precision fix by Peter "Durante" Thoman.
# false = original D16 shadow depth
# true  = D32F_LOCKABLE for recognized 512/1024 shadow depth maps
# Requires a game restart. Enabled here for comparison testing.
ImprovePrecision = true

[Reflections]
Scale = 4

[DepthOfField]
ImproveResolution = true

# Optional legacy-style softening applied after the game's own DoF blur pass.
# 0 = off (default)
# 1 = soft, recommended first test when high-resolution DoF looks too sharp
# 2 = stronger, useful mainly at very high internal resolutions
# This does NOT replace the game's DoF/focus logic.
AdditionalBlur = 0

[World]
# 1 = vanilla high-detail 2x2 core
# 2 = extended high-detail content across the existing 4x4 streaming ring
HighDetailDistanceScale = 1


[Filtering]
# Original = do not alter the game's sampler filtering.
# Bilinear = DPFix-style compatibility fix for ordinary 2D textures:
#            POINT/NONE MIN/MIP filtering is upgraded to LINEAR.
# Anisotropic = smart AF. Only mipmapped, non-render-target 2D textures whose
#               MINFILTER is already LINEAR/ANISOTROPIC are upgraded.
#               Intentional point sampling, MAGFILTER and MIPFILTER remain untouched.
Mode = Original

# Requested anisotropy for Anisotropic mode. Runtime clamps this to device caps.
MaxAnisotropy = 16

[Textures]
# Uses the same 8-digit SuperFastHash names as original DPFix.
# Preferred overrides: ZachFix\textures\override\<hash>.dds or .png
# Legacy DPFix packs in dpfix\tex_override are also discovered automatically.
EnableOverride = true

# false = production path only. Overrides work, but no live texture tracking,
# private-data replacement chain, retained original baseline, dump inspector, or hot reload.
# true = texture-maker workflow: dump -> add/edit/remove override -> Reload without restarting.
# Changing this setting requires a game restart.
DeveloperMode = false

# DPFix = original DPFix behavior. D3DX_DEFAULT may round NPOT overrides up to POT.
# Preserve = request exact file dimensions with D3DX_DEFAULT_NONPOW2.
# Preserve is recommended for bulk 2x AI upscales when source aspect/dimensions must remain exact.
DimensionMode = DPFix

# Developer Mode only. Dumps original game textures as DPFix-compatible <hash>.tga files,
# even when an override is already active. Output: ZachFix\textures\dump
DumpTextures = false

[UI]
Enabled = true
ToggleKey = F10

# Optional gameplay-only tuning pause. This is the original timer-freeze
# research path: it works in normal gameplay but is known to hang some cutscenes.
# Leave it off for cutscenes and use Freeze PostFX Preview in F10 instead.
PauseGameWhileOpen = false

[PostFX.AO]
# Off | ShowRaw | ShowFiltered | ShowEnhanced | CompositeHDR
Mode = Off
Radius = 4.0
Strength = 1.0
Bias = 0.04
Thickness = 0.35
Power = 1.0
# Full | Half | Quarter
Resolution = Half

[PostFX.Bloom]
# Legacy | BloomNG | ShowBloom
Mode = Legacy
ThresholdEV = 0.0
SoftKnee = 0.50
Intensity = 0.35
Scatter = 0.70
Levels = 5

[PostFX.DoF]
# Legacy | DoFNG | ShowCoC | ShowNear | ShowFar
Mode = Legacy
MaxRadiusPixels = 12.0
NearStrength = 1.0
FarStrength = 1.0
DepthReject = 1.5
HighlightBoost = 0.25
# Full | Half | Quarter
Resolution = Half

[PostFX.Exposure]
# Legacy | AutoExposure | Shoulder | AutoExposureShoulder
Mode = Legacy
CompensationEV = 0.0
MeterMinEV = -10.0
MeterMaxEV = 6.0
MinExposureEV = -8.0
MaxExposureEV = 4.0
BrightenSpeed = 1.5
DarkenSpeed = 3.0
ShoulderStrength = 1.0
WhitePoint = 4.0
