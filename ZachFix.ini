; ZachFix v0.2.0
; Deadly Premonition: The Director's Cut restoration/rendering/compatibility fix
; F10 opens the in-game settings UI.

[Display]
Width = 0
Height = 0
Borderless = true

[Rendering]
# Explicit InternalWidth/InternalHeight take priority when both are non-zero.
# Otherwise InternalScale multiplies the final display resolution.
# 1.0 = native, 1.5 = 150%, 2.0 = 200% (supersampling).
InternalWidth = 0
InternalHeight = 0
InternalScale = 1.0
FixPixelOffset = true

[Shadows]
Scale = 4

# Original DPFix shadow-depth precision fix by Peter "Durante" Thoman.
# false = original D16 shadow depth
# true  = D32F_LOCKABLE for recognized 512/1024 shadow depth maps
# Requires a game restart.
ImprovePrecision = true

[Reflections]
Scale = 4

[DepthOfField]
ImproveResolution = true

# Optional legacy-style softening applied after the game's own DoF blur pass.
# 0 = off (default)
# 1 = soft, recommended first test when high-resolution DoF looks too sharp
# 2 = stronger, useful mainly at very high internal resolutions
# This does NOT replace the game's DoF/focus logic.
AdditionalBlur = 0

[World]
# 1 = vanilla high-detail 2x2 core
# 2 = extended high-detail content across the existing 4x4 streaming ring
HighDetailDistanceScale = 1

# Native per-object activation radius used by the world active-list builder.
# 1 = original 1000 world units
# 2 = extended 2000 world units; reduces visible prop pop-in
ObjectActivationDistanceScale = 1

# Fixes the Director's Cut interior visibility-volume regression that can make
# visible props disappear near mirrors/walls. Only the confirmed outer-world
# occlusion callsite is bypassed; normal frustum culling remains active.
FixInteriorOcclusionBugs = true


[Filtering]
# Original = do not alter the game's sampler filtering.
# Bilinear = DPFix-style compatibility fix for ordinary 2D textures:
#            POINT/NONE MIN/MIP filtering is upgraded to LINEAR.
# Anisotropic = smart AF. Only mipmapped, non-render-target 2D textures whose
#               MINFILTER is already LINEAR/ANISOTROPIC are upgraded.
#               Intentional point sampling, MAGFILTER and MIPFILTER remain untouched.
Mode = Original

# Requested anisotropy for Anisotropic mode. Runtime clamps this to device caps.
MaxAnisotropy = 16

[Textures]
# Uses the same 8-digit SuperFastHash names as original DPFix.
# Preferred overrides: ZachFix\textures\override\<hash>.dds or .png
# Legacy DPFix packs in dpfix\tex_override are also discovered automatically.
EnableOverride = true

# false = production path only. Overrides work, but no live texture tracking,
# private-data replacement chain, retained original baseline, dump inspector, or hot reload.
# true = texture-maker workflow: dump -> add/edit/remove override -> Reload without restarting.
# Changing this setting requires a game restart.
DeveloperMode = false

# DPFix = original DPFix behavior. D3DX_DEFAULT may round NPOT overrides up to POT.
# Preserve = request exact file dimensions with D3DX_DEFAULT_NONPOW2.
# Preserve is recommended for bulk 2x AI upscales when source aspect/dimensions must remain exact.
DimensionMode = DPFix

# Developer Mode only. Dumps original game textures as DPFix-compatible <hash>.tga files,
# even when an override is already active. Output: ZachFix\textures\dump
DumpTextures = false

[SaveSafety]
# Protect DP's single-file save with a transactional write:
#   dp.sav.zachtmp -> flush/read-back/validate -> backup old dp.sav -> atomic replace.
# A failed or incomplete temp write never replaces the current live dp.sav.
# Successful commits keep timestamped rolling backups under ZachFix\save_backups\dp.sav\.
Enabled = true
BackupCount = 10

[Gamepad]
# Optional native controller backend. ZachFix reads XInput directly while DP
# keeps its vanilla controller actions/bindings through a compatibility bridge.
NativeXInput = false
# Hot-applied stick/aim behavior for Native XInput.
# PC      = Director's Cut evaluator + secondary filtering + aim shaping.
# Xbox360 = exact Xbox 360 stick normalization (deadzone 7864, scale 0x38286CF7),
#           bypasses the proven PC +/-16/109 + 0.5 slew layer, and restores
#           Xbox aim shaping (0.25 deadzone + 4/3 renormalization), and uses
#           the original LT/RT digital press threshold (>30 raw) while keeping
#           Director's Cut aiming on the RIGHT stick.
InputProfile = Xbox360
# Independent hot-applied vehicle option. true restores all three proven Xbox
# 360 analog LT/RT consumers; false uses vanilla PC digital throttle/brake.
AnalogVehicleTriggers = true
# Deadzone for restored Xbox 360 analog vehicle LT/RT, in raw XInput counts.
# Original Xbox 360 value: 30. raw <= deadzone -> 0; raw > deadzone -> raw/255.
VehicleTriggerDeadzone = 30
# Restores DP's surviving native two-channel rumble through XInput. These two
# values hot-apply from F10 while NativeXInput is active.
Vibration = true
# Overall gain applied after DP has chosen its native motor amplitudes.
# 0.0 = silent, 1.0 = original DP strength.
VibrationStrength = 1.0

[Input]
# Switch DP's own Keyboard/Mouse vs Controller mode to the most recently
# active device while keeping the game's vanilla action and glyph paths.
AutoSwitch = false

[Glyphs]
# Dynamically swaps the texture underneath DP's native glyph UV/layout logic.
# Theme names are plain file stems, so no DP texture hashes are needed:
#   KeyboardSet = redseed   -> ZachFix\glyphs\keyboard\redseed.dds/.png/.tga
#   GamepadSet = retroxbox  -> ZachFix\glyphs\gamepad\retroxbox.dds/.png/.tga
# Use Native to keep DP's captured original atlas for that input family.
# Missing keyboard themes fall back to Native. Missing gamepad themes try xbox
# first, then Native. DP still chooses glyph slots/UVs; ZachFix only picks the atlas.
# Enabling/disabling the glyph binder changes texture ownership and requires a restart.
DynamicAtlas = false
# Automatically watches the selected theme file and swaps in edits without a restart.
# Also notices a requested theme appearing/disappearing and re-runs the normal fallback chain.
HotReload = true
KeyboardSet = Native
GamepadSet = Native

[UI]
Enabled = true
ToggleKey = F10

# Optional gameplay-only tuning pause. This is the original timer-freeze
# research path: it works in normal gameplay but is known to hang some cutscenes.
# Leave it off for cutscenes and use Freeze PostFX Preview in F10 instead.
# When changing this option in F10, click Apply; the new value takes effect
# the next time the F10 panel is opened.
PauseGameWhileOpen = false

[PostFX.AO]
# Off | ShowRaw | ShowFiltered | ShowEnhanced | CompositeHDR
Mode = Off
Radius = 4.0
Strength = 1.0
Bias = 0.04
Thickness = 0.35
Power = 1.0
# Full | Half | Quarter
Resolution = Half

[PostFX.Bloom]
# Legacy | BloomNG | ShowBloom
Mode = Legacy
ThresholdEV = 0.0
SoftKnee = 0.50
Intensity = 0.35
Scatter = 0.70
Levels = 5

[PostFX.DoF]
# Legacy | DoFNG | ShowCoC | ShowNear | ShowFar
Mode = Legacy
MaxRadiusPixels = 12.0
NearStrength = 1.0
FarStrength = 1.0
DepthReject = 1.5
HighlightBoost = 0.25
# Full | Half | Quarter
Resolution = Half

[PostFX.Exposure]
# Legacy | AutoExposure | Shoulder | AutoExposureShoulder
Mode = Legacy
CompensationEV = 0.0
MeterMinEV = -10.0
MeterMaxEV = 6.0
MinExposureEV = -8.0
MaxExposureEV = 4.0
BrightenSpeed = 1.5
DarkenSpeed = 3.0
ShoulderStrength = 1.0
WhitePoint = 4.0
